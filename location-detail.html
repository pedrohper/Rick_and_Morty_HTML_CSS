<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Details - Rick and Morty</title>
    <link rel="stylesheet" href="css/style.css" type="text/css" media="all" />
    <link rel="icon" href="assets/logo-black.png" type="image/x-icon">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="assets/logo.png" alt="Rick and Morty Logo">
            </div>
            <ul class="menu">
                <li><a href="characters.html">Characters</a></li>
                <li><a href="locations.html">Locations</a></li>
                <li><a href="episodes.html">Episodes</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="back-navigation">
            <a href="locations.html" class="btn-back">
                <span class="arrow">&larr;</span> VOLTAR
            </a>
        </div>

        <section class="profile-header">
            <h1 id="location-name">-</h1>
            <p id="location-type" class="subtitle">-</p>
        </section>

        <main class="details-content">
            <section class="info-section">
                <h2>Informations</h2>
                <ul class="info-list">
                    <li class="info-item">
                        <span class="label">Type</span>
                        <span class="value" id="type">-</span>
                    </li>
                    <li class="info-item">
                        <span class="label">Dimension</span>
                        <span class="value" id="dimension">-</span>
                    </li>
                </ul>
            </section>

            <section class="residents-section">
                <h2>Residents</h2>
                <div class="card-galery" id="residents-gallery"></div>
            </section>
        </main>
    </div>

    <footer>
        <p>Make with ❤️ for pedrohper</p>
    </footer>

    <script src="js/location-detail.js"></script>
</body>
</html>
