<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty</title>
    <link rel="stylesheet" href="../styles/global.css" type="text/css" media="all" />
    <link rel="stylesheet" href="../styles/card-galery.css" type="text/css" media="all" />
    <link rel="icon" href="../assets/logo-black.png" type="image/x-icon">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="../assets/logo.png" alt="Rick and Morty Logo">
            </div>
            <ul class="menu">
                <li><a href="characters.html">Characters</a></li>
                <li><a href="locations.html">Locations</a></li>
                <li><a href="episodes.html">Episodes</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <img src="../assets/logo.png" alt="Rick and Morty Logo">
        </section>

        <section class="filters">
            <div class="search">
                <input type="text" placeholder="Filter by name...">
            </div>

            <select id="species-filter">
                <option value="">Species</option>
                <option value="human">Human</option>
                <option value="alien">Alien</option>
                <option value="humanoid">Humanoid</option>
                <option value="mythological creature">Mythological Creature</option>
                <option value="robot">Robot</option>
                <option value="unknown">unknown</option>
                <option value="poopybutthole">Poopybutthole</option>
                <option value="animal">Animal</option>
                <option value="cronenberg">Cronenberg</option>
                <option value="disease">Disease</option>
            </select>

            <select id="gender-filter">
                <option value="">Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <select id="status-filter">
                <option value="">Status</option>
                <option value="alive">Alive</option>
                <option value="dead">Dead</option>
            </select>
        </section>

        <main class="card-galery" id="card-galery">

        </main>

        <section class="load-more">
            <button>LOAD MORE</button>
        </section>
    </div>

    <footer>
        <p>Make with ❤️ for pedrohper</p>
    </footer>
    <script src="../js/characters/index.js"></script>
    <script src="../js/characters/detail.js"></script>
</body>
</html>
