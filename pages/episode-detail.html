<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episode Details - Rick and Morty</title>
    <link rel="stylesheet" href="../styles/global.css" type="text/css" media="all" />
    <link rel="stylesheet" href="../styles/detail.css" type="text/css" media="all" />
    <link rel="icon" href="../assets/logo-black.png" type="image/x-icon">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="../assets/logo.png" alt="Rick and Morty Logo">
            </div>
            <ul class="menu">
                <li><a href="characters.html">Characters</a></li>
                <li><a href="locations.html">Locations</a></li>
                <li><a href="episodes.html">Episodes</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="back-navigation">
            <a href="episodes.html" class="btn-back">
                <span class="arrow">&larr;</span> VOLTAR
            </a>
        </div>

        <section class="profile-header">
            <h1 id="episode-name">-</h1>
            <p id="episode-code" class="subtitle">-</p>
        </section>

        <main class="details-content">
            <section class="info-section">
                <h2>Informations</h2>
                <ul class="info-list">
                    <li class="info-item">
                        <span class="label">Episode</span>
                        <span class="value" id="code-val">-</span>
                    </li>
                    <li class="info-item">
                        <span class="label">Air Date</span>
                        <span class="value" id="air-date">-</span>
                    </li>
                </ul>
            </section>

            <section class="characters-section">
                <h2>Characters in this episode</h2>
                <div class="card-galery" id="characters-gallery"></div>
            </section>
        </main>
    </div>

    <footer>
        <p>Make with ❤️ for pedrohper</p>
    </footer>

    <script src="../js/episodes/detail.js"></script>
</body>
</html>
