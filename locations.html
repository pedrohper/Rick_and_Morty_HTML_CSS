<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations - Steel Ball Run</title>
    <link rel="stylesheet" href="style/style.css" type="text/css" media="all" />
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="assets/logo.png" alt="Steel Ball Run">
            </div>

            <ul class="menu">
                <li><a href="characters.html">Characters</a></li>
                <li><a href="locations.html">Locations</a></li>
                <li><a href="episodes.html">Episodes</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- Hero Image -->
        <section class="hero">
            <img src="assets/logo.png" alt="Steel Ball Run Logo">
        </section>

        <!-- Filtros de Locais -->
        <section class="filters">
            <div class="search">
                <input type="text" placeholder="Filter by name...">
            </div>

            <select>
                <option value="">Type</option>
                <option value="checkpoint">Checkpoint</option>
                <option value="city">City</option>
                <option value="landmark">Landmark</option>
            </select>

            <select>
                <option value="">Dimension</option>
                <option value="base">Base Universe</option>
                <option value="parallel">Parallel World</option>
            </select>
        </section>

        <!-- Galeria de Cards sem Imagem -->
        <main class="card-galery location-galery">
            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>San Diego Beach</h3>
                        <p>Checkpoint</p>
                    </div>
                </a>
            </article>

            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>Arizona Desert</h3>
                        <p>Landmark</p>
                    </div>
                </a>
            </article>

            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>Cannon City</h3>
                        <p>City</p>
                    </div>
                </a>
            </article>

            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>Kansas City</h3>
                        <p>City</p>
                    </div>
                </a>
            </article>

            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>Chicago</h3>
                        <p>City</p>
                    </div>
                </a>
            </article>

            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>Mackinaw City</h3>
                        <p>Checkpoint</p>
                    </div>
                </a>
            </article>

            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>Philadelphia</h3>
                        <p>City</p>
                    </div>
                </a>
            </article>

            <article class="card location-card">
                <a href="#">
                    <div class="card-content">
                        <h3>New York City</h3>
                        <p>Final Checkpoint</p>
                    </div>
                </a>
            </article>
        </main>

        <section class="load-more">
            <button>LOAD MORE</button>
        </section>
    </div>

    <footer>
        <p>Make with ❤️ for pedrohper</p>
    </footer>
</body>
</html>
